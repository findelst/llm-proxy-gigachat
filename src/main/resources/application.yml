spring:
  application:
    name: llm-proxy

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        llm_proxy_queue_wait_seconds: true
        llm_proxy_provider_latency_seconds: true

llm:
  proxy:
    api:
      base-url: ${LLM_API_BASE:https://gigachat.devices.sberbank.ru/v1}
      key: ${LLM_API_KEY:}
      timeout: ${LLM_TIMEOUT:300s}
    model:
      default-name: ${LLM_DEFAULT_MODEL_NAME:GigaChat}
      override: ${LLM_MODEL_NAME:}
      temperature: ${LLM_TEMPERATURE:0.0}
      top-p: ${LLM_TOP_P:1.0}
      max-tokens: ${LLM_MAX_TOKENS:50000}
    queue:
      # The queue now uses strict FIFO ordering within each priority level
      default-priority: ${LLM_PRIORITY_DEFAULT:p2}
      max-length: ${LLM_QUEUE_MAX_LEN:100}
      timeout-minutes: ${LLM_QUEUE_TIMEOUT_MINUTES:10}
      timeout-check-interval-ms: ${LLM_QUEUE_TIMEOUT_CHECK_MS:60000}
      retry:
        enabled: ${LLM_RETRY_ENABLED:true}
        max-attempts: ${LLM_RETRY_MAX_ATTEMPTS:3}
        initial-delay-ms: ${LLM_RETRY_INITIAL_DELAY_MS:1000}
        max-delay-ms: ${LLM_RETRY_MAX_DELAY_MS:30000}
        backoff-multiplier: ${LLM_RETRY_BACKOFF_MULTIPLIER:2.0}
        retryable-status-codes:
          - 429
          - 500
          - 502
          - 503
          - 504
    cache:
      enabled: ${LLM_CACHE_ENABLED:true}
      ttl: ${LLM_CACHE_TTL:10m}
      max-size: ${LLM_CACHE_MAX_SIZE:1000}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    ru.ddd.llmproxy: ${LOG_LEVEL_APP:DEBUG}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{x-request-id}] %-5level %logger{36} - %msg%n"
